[tool.poetry]
name = "ai-chat-neural"
version = "0.1.0"
description = "AI Chat Bot with Clean Architecture"
authors = ["TikhonovAS <tihas987@gmail.com>"]
readme = "README.md"
packages = [{include = "*", from = "src"}]

[tool.poetry.dependencies]
python = "^3.14"
python-dotenv = "^1.0.0"
requests = "^2.31.0"
fastapi = "^0.137.0"
uvicorn = {extras = ["standard"], version = "^0.49.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"